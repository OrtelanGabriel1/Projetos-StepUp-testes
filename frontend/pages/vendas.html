<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas — StepUp Calçados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>
<div id="sidebar-mount"></div>
<div class="app-shell">
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-info">
          <h2>Vendas</h2>
          <p>Registre e acompanhe todas as vendas</p>
        </div>
        <button class="btn btn-primary" onclick="abrirNovo()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nova Venda
        </button>
      </div>

      <div id="total-banner" style="background:linear-gradient(135deg,var(--blue-700),var(--blue-500));color:white;border-radius:12px;padding:20px 24px;margin-bottom:20px;display:flex;gap:32px;align-items:center">
        <div><div style="font-size:.8rem;opacity:.8">Total de Vendas</div><div style="font-size:1.8rem;font-weight:800" id="total-valor">R$ 0,00</div></div>
        <div><div style="font-size:.8rem;opacity:.8">Quantidade</div><div style="font-size:1.8rem;font-weight:800" id="total-qtd">0</div></div>
        <div><div style="font-size:.8rem;opacity:.8">Canceladas</div><div style="font-size:1.8rem;font-weight:800" id="total-cancel">0</div></div>
      </div>

      <div class="filter-bar">
        <input type="text" class="form-control" id="search" placeholder="🔍 Buscar por ID...">
        <select class="form-control" id="filter-status">
          <option value="">Todos os status</option>
          <option value="concluida">Concluída</option>
          <option value="cancelada">Cancelada</option>
          <option value="pendente">Pendente</option>
        </select>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Data</th><th>Funcionário</th><th>Valor Total</th><th>Desconto</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="pagination"></div>
        <div id="empty"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NOVA VENDA -->
<div class="modal-overlay" id="modal">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 class="modal-title">Registrar Venda</h3>
      <button class="modal-close" onclick="closeModal('modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Produto *</label>
          <select class="form-control" id="f-produto" onchange="calcTotal()"></select>
        </div>
        <div class="form-grid form-grid-2">
          <div class="form-group">
            <label>Quantidade *</label>
            <input type="number" class="form-control" id="f-qtd" min="1" value="1" onchange="calcTotal()">
          </div>
          <div class="form-group">
            <label>Desconto (R$)</label>
            <input type="number" class="form-control" id="f-desconto" min="0" step="0.01" value="0" onchange="calcTotal()">
          </div>
        </div>
        <div style="background:var(--blue-50);border:1.5px solid var(--blue-200);border-radius:var(--radius);padding:14px">
          <div style="font-size:.8rem;color:var(--gray-600)">Valor Total Estimado</div>
          <div id="total-preview" style="font-size:1.5rem;font-weight:800;color:var(--blue-700)">R$ 0,00</div>
        </div>
        <div class="form-group">
          <label>Observação</label>
          <textarea class="form-control" id="f-obs" rows="2" placeholder="Observações sobre a venda..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal')">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="salvar()">Registrar Venda</button>
    </div>
  </div>
</div>

<!-- CONFIRM CANCELAR -->
<div class="modal-overlay" id="confirm-overlay">
  <div class="modal" style="max-width:400px">
    <div class="modal-body" style="text-align:center;padding:32px 24px">
      <div style="font-size:40px;margin-bottom:12px">⚠️</div>
      <strong style="display:block;font-size:1rem;margin-bottom:8px">Cancelar Venda</strong>
      <p id="confirm-text">Tem certeza que deseja cancelar esta venda?</p>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-outline" onclick="closeModal('confirm-overlay')">Fechar</button>
      <button class="btn btn-danger" id="confirm-ok">Cancelar Venda</button>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  checkAuth();
  document.getElementById('sidebar-mount').innerHTML = buildSidebar('vendas');
  document.getElementById('topbar-mount').innerHTML = buildTopbar('Vendas');
  populateUser(checkAuth());
  initSidebar();

  let all = [], allProdutos = [], page = 1;

  async function load() {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="7"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>';
    try {
      const [vr, pr] = await Promise.all([api.vendas.listar(), api.produtos.listar()]);
      all = vr?.dados || vr || [];
      allProdutos = pr?.dados || pr || [];
      popularProdutos();
      atualizarBanner();
      render();
    } catch(e) { toast('Erro: ' + e.message, 'error'); }
  }

  function popularProdutos() {
    const sel = document.getElementById('f-produto');
    sel.innerHTML = '<option value="">Selecione um produto</option>';
    allProdutos.forEach(p => sel.innerHTML += `<option value="${p.id}" data-preco="${p.preco}">${p.nome} — ${brl(p.preco)}</option>`);
  }

  function atualizarBanner() {
    const total = all.reduce((s, v) => s + parseFloat(v.valor_total||0), 0);
    const cancel = all.filter(v => v.status === 'cancelada').length;
    document.getElementById('total-valor').textContent = brl(total);
    document.getElementById('total-qtd').textContent   = all.length;
    document.getElementById('total-cancel').textContent = cancel;
  }

  function calcTotal() {
    const sel = document.getElementById('f-produto');
    const preco = parseFloat(sel.selectedOptions[0]?.dataset?.preco || 0);
    const qtd   = parseInt(document.getElementById('f-qtd').value || 1);
    const desc  = parseFloat(document.getElementById('f-desconto').value || 0);
    const total = Math.max(0, preco * qtd - desc);
    document.getElementById('total-preview').textContent = brl(total);
  }

  function statusBadge(s) {
    const map = { concluida: 'badge-green', cancelada: 'badge-red', pendente: 'badge-yellow' };
    const icon = { concluida: '✅', cancelada: '❌', pendente: '⏳' };
    return `<span class="badge ${map[s]||'badge-gray'}">${icon[s]||'•'} ${s || 'desconhecido'}</span>`;
  }

  function filtered() {
    const q  = document.getElementById('search').value.toLowerCase();
    const st = document.getElementById('filter-status').value;
    return all.filter(v =>
      (!q  || String(v.id).includes(q)) &&
      (!st || v.status === st)
    );
  }

  function render() {
    const items = filtered();
    const { items: pg, total, pages } = paginate(items, page);
    const tbody = document.getElementById('tbody');
    if (!pg.length) {
      tbody.innerHTML = '';
      document.getElementById('empty').innerHTML = `<div class="empty-state"><div class="es-icon">🛍️</div><h3>Nenhuma venda encontrada</h3></div>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    document.getElementById('empty').innerHTML = '';
    tbody.innerHTML = pg.map(v => `<tr>
      <td><span style="color:var(--gray-400);font-size:.8rem">#${v.id}</span></td>
      <td>${dateTimeStr(v.data_venda||v.created_at)}</td>
      <td>${v.nome_funcionario || v.id_funcionario || '-'}</td>
      <td><strong>${brl(v.valor_total)}</strong></td>
      <td>${v.desconto ? brl(v.desconto) : '-'}</td>
      <td>${statusBadge(v.status)}</td>
      <td class="td-actions">
        ${v.status !== 'cancelada' ? `<button class="btn btn-danger btn-sm" onclick="cancelarVenda(${v.id})">Cancelar</button>` : '<span style="color:var(--gray-400);font-size:.8rem">—</span>'}
      </td>
    </tr>`).join('');
    renderPagination(document.getElementById('pagination'), { total, page, pages, onPage: p => { page=p; render(); }});
  }

  document.getElementById('search').addEventListener('input', () => { page=1; render(); });
  document.getElementById('filter-status').addEventListener('change', () => { page=1; render(); });

  function abrirNovo() {
    document.getElementById('f-produto').value = '';
    document.getElementById('f-qtd').value = '1';
    document.getElementById('f-desconto').value = '0';
    document.getElementById('f-obs').value = '';
    document.getElementById('total-preview').textContent = 'R$ 0,00';
    openModal('modal');
  }

  async function salvar() {
    const id_produto = parseInt(document.getElementById('f-produto').value);
    const quantidade = parseInt(document.getElementById('f-qtd').value);
    const desconto   = parseFloat(document.getElementById('f-desconto').value || 0);
    const observacao = document.getElementById('f-obs').value.trim() || undefined;
    if (!id_produto || !quantidade) { toast('Preencha produto e quantidade.', 'warning'); return; }
    const sel = document.getElementById('f-produto');
    const preco = parseFloat(sel.selectedOptions[0]?.dataset?.preco || 0);
    const valor_total = Math.max(0, preco * quantidade - desconto);
    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Registrando...';
    try {
      await api.vendas.registrar({ id_produto, quantidade, desconto, valor_total, observacao });
      toast('Venda registrada!', 'success');
      closeModal('modal');
      load();
    } catch(e) { toast('Erro: ' + e.message, 'error');
    } finally { btn.disabled = false; btn.textContent = 'Registrar Venda'; }
  }

  function cancelarVenda(id) {
    confirm(`Cancelar a venda #${id}? Esta ação irá estornar o estoque.`, async () => {
      try { await api.vendas.cancelar(id); toast('Venda cancelada!', 'info'); load(); }
      catch(e) { toast('Erro: ' + e.message, 'error'); }
    });
  }

  load();
</script>
</body>
</html>
