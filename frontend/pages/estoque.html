<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque — StepUp Calçados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>
<div id="sidebar-mount"></div>
<div class="app-shell">
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-info">
          <h2>Estoque</h2>
          <p>Controle os níveis de estoque por produto</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-outline" onclick="loadBaixo()">⚠️ Ver Alertas</button>
          <button class="btn btn-primary" onclick="abrirNovo()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Adicionar ao Estoque
          </button>
        </div>
      </div>

      <div id="alerta-banner" style="display:none;background:var(--red-100);border:1.5px solid var(--red-500);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:none;align-items:center;gap:12px">
        <span style="font-size:20px">⚠️</span>
        <span style="font-size:.875rem;font-weight:600;color:#b91c1c" id="alerta-text"></span>
        <button onclick="document.getElementById('alerta-banner').style.display='none'" style="margin-left:auto;color:#b91c1c;font-weight:700">✕</button>
      </div>

      <div class="filter-bar">
        <input type="text" class="form-control" id="search" placeholder="🔍 Buscar produto...">
        <select class="form-control" id="filter-status">
          <option value="">Todos os status</option>
          <option value="baixo">Estoque Baixo</option>
          <option value="ok">Estoque OK</option>
        </select>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Produto</th><th>Quantidade</th><th>Qtd. Mínima</th><th>Localização</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="pagination"></div>
        <div id="empty"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="m-title">Adicionar Estoque</h3>
      <button class="modal-close" onclick="closeModal('modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Produto *</label>
          <select class="form-control" id="f-produto"></select>
        </div>
        <div class="form-grid form-grid-2">
          <div class="form-group">
            <label>Quantidade *</label>
            <input type="number" class="form-control" id="f-qtd" min="0" placeholder="0">
          </div>
          <div class="form-group">
            <label>Quantidade Mínima</label>
            <input type="number" class="form-control" id="f-qtd-min" min="0" placeholder="0">
          </div>
        </div>
        <div class="form-group">
          <label>Localização</label>
          <input type="text" class="form-control" id="f-local" placeholder="Ex: Prateleira A3">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal')">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirm-overlay">
  <div class="modal" style="max-width:400px">
    <div class="modal-body" style="text-align:center;padding:32px 24px">
      <div style="font-size:40px;margin-bottom:12px">🗑️</div>
      <strong style="display:block;font-size:1rem;margin-bottom:8px">Remover do Estoque</strong>
      <p id="confirm-text"></p>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-outline" onclick="closeModal('confirm-overlay')">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok">Remover</button>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  checkAuth();
  document.getElementById('sidebar-mount').innerHTML = buildSidebar('estoque');
  document.getElementById('topbar-mount').innerHTML = buildTopbar('Estoque');
  populateUser(checkAuth());
  initSidebar();

  let all = [], allProdutos = [], currentId = null, page = 1;

  async function load() {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="7"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>';
    try {
      const [est, prods, baixo] = await Promise.all([api.estoque.listar(), api.produtos.listar(), api.estoque.baixo()]);
      all = est?.dados || est || [];
      allProdutos = prods?.dados || prods || [];
      populateProdutos();

      const b = baixo?.dados || baixo || [];
      if (b.length > 0) {
        const banner = document.getElementById('alerta-banner');
        document.getElementById('alerta-text').textContent = `${b.length} produto(s) com estoque abaixo do mínimo!`;
        banner.style.display = 'flex';
      }
      render();
    } catch(e) { toast('Erro ao carregar estoque: ' + e.message, 'error'); }
  }

  async function loadBaixo() {
    try {
      const r = await api.estoque.baixo();
      all = r?.dados || r || [];
      render();
    } catch(e) { toast('Erro: ' + e.message, 'error'); }
  }

  function populateProdutos() {
    const sel = document.getElementById('f-produto');
    sel.innerHTML = '<option value="">Selecione um produto</option>';
    allProdutos.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.nome}</option>`);
  }

  function getNomeProduto(id) {
    const p = allProdutos.find(x => x.id == id);
    return p?.nome || `Produto #${id}`;
  }

  function filtered() {
    const q  = document.getElementById('search').value.toLowerCase();
    const st = document.getElementById('filter-status').value;
    return all.filter(e => {
      const nome = getNomeProduto(e.id_produto).toLowerCase();
      const eBaixo = e.quantidade <= (e.quantidade_minima ?? 0);
      return (!q || nome.includes(q)) &&
             (!st || (st === 'baixo' ? eBaixo : !eBaixo));
    });
  }

  function render() {
    const items = filtered();
    const { items: pg, total, pages } = paginate(items, page);
    const tbody = document.getElementById('tbody');
    if (!pg.length) {
      tbody.innerHTML = '';
      document.getElementById('empty').innerHTML = `<div class="empty-state"><div class="es-icon">📦</div><h3>Nenhum item no estoque</h3></div>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    document.getElementById('empty').innerHTML = '';
    tbody.innerHTML = pg.map(e => {
      const baixo = e.quantidade <= (e.quantidade_minima ?? 0);
      return `<tr>
        <td><span style="color:var(--gray-400);font-size:.8rem">#${e.id}</span></td>
        <td><strong>${getNomeProduto(e.id_produto)}</strong></td>
        <td><strong style="font-size:1.1rem;color:${baixo?'var(--red-500)':'var(--gray-800)'}">${e.quantidade}</strong></td>
        <td>${e.quantidade_minima ?? '-'}</td>
        <td>${e.localizacao || '-'}</td>
        <td>${baixo ? '<span class="badge badge-red">⚠️ Baixo</span>' : '<span class="badge badge-green">✅ OK</span>'}</td>
        <td class="td-actions">
          <button class="btn btn-outline btn-sm" onclick="editar(${e.id})">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="excluir(${e.id}, '${getNomeProduto(e.id_produto).replace(/'/g,"\\'")}')">🗑️</button>
        </td>
      </tr>`;
    }).join('');
    renderPagination(document.getElementById('pagination'), { total, page, pages, onPage: p => { page=p; render(); }});
  }

  document.getElementById('search').addEventListener('input', () => { page=1; render(); });
  document.getElementById('filter-status').addEventListener('change', () => { page=1; render(); });

  function abrirNovo() {
    currentId = null;
    document.getElementById('m-title').textContent = 'Adicionar Estoque';
    document.getElementById('f-produto').value = '';
    document.getElementById('f-qtd').value = '';
    document.getElementById('f-qtd-min').value = '';
    document.getElementById('f-local').value = '';
    openModal('modal');
  }

  async function editar(id) {
    try {
      const r = await api.estoque.buscar(id);
      const e = r?.dados || r;
      currentId = id;
      document.getElementById('m-title').textContent = 'Editar Estoque';
      document.getElementById('f-produto').value  = e.id_produto || '';
      document.getElementById('f-qtd').value      = e.quantidade || '';
      document.getElementById('f-qtd-min').value  = e.quantidade_minima || '';
      document.getElementById('f-local').value    = e.localizacao || '';
      openModal('modal');
    } catch(e) { toast('Erro: ' + e.message, 'error'); }
  }

  async function salvar() {
    const body = {
      id_produto:        parseInt(document.getElementById('f-produto').value),
      quantidade:        parseInt(document.getElementById('f-qtd').value),
      quantidade_minima: parseInt(document.getElementById('f-qtd-min').value) || undefined,
      localizacao:       document.getElementById('f-local').value.trim() || undefined,
    };
    if (!body.id_produto || isNaN(body.quantidade)) { toast('Preencha produto e quantidade.', 'warning'); return; }
    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Salvando...';
    try {
      if (currentId) await api.estoque.atualizar(currentId, body);
      else           await api.estoque.cadastrar(body);
      toast('Estoque salvo!', 'success');
      closeModal('modal');
      load();
    } catch(e) { toast('Erro: ' + e.message, 'error');
    } finally { btn.disabled = false; btn.textContent = 'Salvar'; }
  }

  function excluir(id, nome) {
    confirm(`Remover o registro de estoque do produto "${nome}"?`, async () => {
      try { await api.estoque.deletar(id); toast('Removido!', 'success'); load(); }
      catch(e) { toast('Erro: ' + e.message, 'error'); }
    });
  }

  load();
</script>
</body>
</html>
