<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias — StepUp Calçados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>
<div id="sidebar-mount"></div>
<div class="app-shell">
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-info">
          <h2>Categorias</h2>
          <p>Organize os tipos de calçados por categoria</p>
        </div>
        <button class="btn btn-primary" onclick="abrirNovo()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nova Categoria
        </button>
      </div>

      <div class="filter-bar">
        <input type="text" class="form-control" id="search" placeholder="🔍 Buscar categoria...">
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Nome</th><th>Descrição</th><th>Ações</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="pagination"></div>
        <div id="empty"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <h3 class="modal-title" id="m-title">Nova Categoria</h3>
      <button class="modal-close" onclick="closeModal('modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" class="form-control" id="f-nome" placeholder="Ex: Tênis, Sandálias, Botas...">
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <textarea class="form-control" id="f-desc" rows="3" placeholder="Descreva esta categoria..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal')">Cancelar</button>
      <button class="btn btn-primary" id="btn-save" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirm-overlay">
  <div class="modal" style="max-width:400px">
    <div class="modal-body" style="text-align:center;padding:32px 24px">
      <div style="font-size:40px;margin-bottom:12px">🗑️</div>
      <strong style="display:block;font-size:1rem;margin-bottom:8px">Excluir Categoria</strong>
      <p id="confirm-text"></p>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-outline" onclick="closeModal('confirm-overlay')">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok">Excluir</button>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  checkAuth();
  document.getElementById('sidebar-mount').innerHTML = buildSidebar('categorias');
  document.getElementById('topbar-mount').innerHTML = buildTopbar('Categorias');
  populateUser(checkAuth());
  initSidebar();

  let all = [], currentId = null, page = 1;

  async function load() {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="4"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>';
    try {
      const r = await api.categorias.listar();
      all = r?.dados || r || [];
      render();
    } catch(e) { toast('Erro: ' + e.message, 'error'); }
  }

  function filtered() {
    const q = document.getElementById('search').value.toLowerCase();
    return all.filter(c => !q || (c.nome||'').toLowerCase().includes(q));
  }

  function render() {
    const items = filtered();
    const { items: pg, total, pages } = paginate(items, page);
    const tbody = document.getElementById('tbody');
    if (!pg.length) {
      tbody.innerHTML = '';
      document.getElementById('empty').innerHTML = `<div class="empty-state"><div class="es-icon">📋</div><h3>Nenhuma categoria encontrada</h3></div>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    document.getElementById('empty').innerHTML = '';
    tbody.innerHTML = pg.map(c => `<tr>
      <td><span style="color:var(--gray-400);font-size:.8rem">#${c.id}</span></td>
      <td><strong>${c.nome || '-'}</strong></td>
      <td style="color:var(--gray-600)">${c.descricao || '-'}</td>
      <td class="td-actions">
        <button class="btn btn-outline btn-sm" onclick="editar(${c.id})">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="excluir(${c.id}, '${(c.nome||'').replace(/'/g,"\\'")}')">🗑️</button>
      </td>
    </tr>`).join('');
    renderPagination(document.getElementById('pagination'), { total, page, pages, onPage: p => { page=p; render(); }});
  }

  document.getElementById('search').addEventListener('input', () => { page=1; render(); });

  function abrirNovo() {
    currentId = null;
    document.getElementById('m-title').textContent = 'Nova Categoria';
    document.getElementById('f-nome').value = '';
    document.getElementById('f-desc').value = '';
    openModal('modal');
  }

  async function editar(id) {
    try {
      const r = await api.categorias.buscar(id);
      const c = r?.dados || r;
      currentId = id;
      document.getElementById('m-title').textContent = 'Editar Categoria';
      document.getElementById('f-nome').value = c.nome || '';
      document.getElementById('f-desc').value = c.descricao || '';
      openModal('modal');
    } catch(e) { toast('Erro: ' + e.message, 'error'); }
  }

  async function salvar() {
    const nome = document.getElementById('f-nome').value.trim();
    const descricao = document.getElementById('f-desc').value.trim() || undefined;
    if (!nome) { toast('Informe o nome da categoria.', 'warning'); return; }
    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Salvando...';
    try {
      if (currentId) await api.categorias.atualizar(currentId, { nome, descricao });
      else           await api.categorias.cadastrar({ nome, descricao });
      toast(currentId ? 'Categoria atualizada!' : 'Categoria criada!', 'success');
      closeModal('modal');
      load();
    } catch(e) { toast('Erro: ' + e.message, 'error');
    } finally { btn.disabled = false; btn.textContent = 'Salvar'; }
  }

  function excluir(id, nome) {
    confirm(`Excluir a categoria "${nome}"?`, async () => {
      try { await api.categorias.deletar(id); toast('Categoria excluída!', 'success'); load(); }
      catch(e) { toast('Erro: ' + e.message, 'error'); }
    });
  }

  load();
</script>
</body>
</html>
